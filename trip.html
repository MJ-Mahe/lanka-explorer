<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lanka Explorer helps travellers discover and plan trips around Sri Lanka.">
  <title>Lanka Explorer | My Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Lanka Explorer</a>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="trip.html" class="active">My Trip</a></li>
        <li><a href="about.html">About</a></li>
        <li><button class="theme-toggle" type="button">Dark mode</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>My Trip</h1>
    <div id="trip-summary"></div>

    <label for="travellers">Number of travellers</label>
    <input type="number" id="travellers" min="1" max="20" value="1">

    <table id="trip-table">
      <thead>
        <tr>
          <th>Destination</th>
          <th>Category</th>
          <th>Fee per person (USD)</th>
          <th>Fee per person (LKR)</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows are created by JavaScript -->
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">Total for all travellers</td>
          <td id="total-usd">USD 0</td>
          <td id="total-lkr">Rs. 0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <button id="clear-trip" type="button">Clear trip</button>
  </main>

  <footer>
    <p>&copy; 2026 Lanka Explorer – Group Name. All rights reserved.</p>
    <p>Contact: <a href="mailto:hello@lankaexplorer.lk">hello@lankaexplorer.lk</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
